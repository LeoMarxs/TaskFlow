  sortBy = "default"; renderContent();
}

/* ══════════════════════════════════════════════════════════════════
   VIEW KANBAN
   Três colunas (Pendente / Em Progresso / Concluída) com drag-and-drop.
   WIP Limit: se o número de cards em "Em Progresso" exceder o limite,
   o contador fica vermelho (aviso visual, não bloqueio).
   dragStart → registra o card sendo arrastado
   dropTask  → move o card para a nova coluna (atualiza status)
══════════════════════════════════════════════════════════════════ */
function renderKanban(){
  const filtered = getFiltered();
  const cols = [
    {s:"pending",     title:"Pendente",    clr:"var(--amb)", icon:"○", limit:8},
    {s:"in_progress", title:"Em Progresso",clr:"var(--blu)", icon:"▶", limit:5},
    {s:"done",        title:"Concluída",   clr:"var(--grn)", icon:"✓", limit:null},
  ];
  return `
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <h2 style="font-size:22px">Kanban Board</h2>
      <p style="font-size:12px;color:var(--tx3)">${filtered.length} tarefa${filtered.length!==1?"s":""} visível${filtered.length!==1?"is":""}</p>
    </div>
    <div class="kb-board">
      ${cols.map(c=>{
        const tasks = filtered.filter(t=>t.status===c.s);
        const over  = c.limit && tasks.length > c.limit; // WIP limit atingido
        return `<div class="kb-col">
          <div class="kb-header">
            <span style="font-size:12px">${c.icon}</span>
            <span style="font-size:12px;font-weight:700;color:${c.clr}">${c.title}</span>
            <span style="font-size:11px;background:var(--bg);border:1px solid var(--bdr);border-radius:20px;padding:1px 8px;font-weight:600;margin-left:auto;color:${over?"var(--red)":"var(--tx3)"}">${tasks.length}${c.limit?"/"+c.limit:""}</span>
          </div>
          <!-- Área de drop: muda visual quando um card é arrastado sobre ela -->
          <div class="kb-drop" id="kbcol-${c.s}" data-status="${c.s}"
            ondragover="event.preventDefault();this.classList.add('over')"
            ondragleave="this.classList.remove('over')"
            ondrop="dropTask(event,'${c.s}')"
            role="group" aria-label="Coluna ${c.title}">
            ${tasks.map(t=>taskCardHTML(t,true)).join("")}
            <div class="kb-empty">Arraste tarefas aqui</div>
          </div>
        </div>`;
      }).join("")}
    </div>`;
}
// Variável global para rastrear o card sendo arrastado
let draggingId = null;
function dragStart(e, id){
  draggingId = id;
  e.dataTransfer.setData("tid", id);
  e.dataTransfer.effectAllowed = "move";
}
function dropTask(e, status){
  e.preventDefault();
  e.currentTarget.classList.remove("over");
  const id = e.dataTransfer.getData("tid") || draggingId;
  draggingId = null;
  if(!id) return;
  const t = getTask(id);
  if(!t || t.status===status) return; // sem mudança de status
  // Verifica permissão: admin, criador ou responsável podem mover
  const canEdit = me.role==="admin" || t.creator===me.id || t.assignee===me.id;
  if(!canEdit){ toast("Sem permissão para mover esta tarefa","!","var(--red)"); return; }
  updateTask(id, {status}, `movida → "${SL[status]}"`);
}

/* ══════════════════════════════════════════════════════════════════
   SISTEMA DE MENÇÕES (@usuario)
   Quando o usuário digita @ em um textarea, o popup de autocomplete
   aparece com a lista de usuários filtrada pelo texto após o @.
   Suporta navegação por teclado (↑↓) e seleção com Enter/Tab.

   mentionState → objeto que guarda o estado atual da menção ativa:
     active      → se o popup está aberto
     query       → texto digitado após o @
     startPos    → posição do @ no textarea
     textareaId  → id do textarea onde está sendo digitado
     selectedIdx → índice do item selecionado no popup

   setupMentionTextarea → ativa o sistema em um textarea específico
   extractMentions      → encontra todos @nomes no texto
   renderCommentText    → formata o texto substituindo @nomes por chips
══════════════════════════════════════════════════════════════════ */
let mentionState = {active:false, query:"", startPos:0, textareaId:null, selectedIdx:0};

function getMatchingUsers(q){ return USERS.filter(u=>u.name.toLowerCase().includes(q.toLowerCase())); }

function showMentionPopup(ta, users){
  const popup = document.getElementById("mention-popup");
  const rect  = ta.getBoundingClientRect();
  popup.innerHTML = users.map((u,i)=>`
    <div class="mention-item${i===mentionState.selectedIdx?" sel":""}" onclick="insertMention('${u.id}')" role="option">
      ${avHTML(u,22)}
      <div><p style="font-size:12px;font-weight:600">${esc(u.name)}</p><p style="font-size:10px;color:var(--tx3)">${esc(u.title)}</p></div>
    </div>`).join("");
  // Posiciona o popup abaixo do textarea, alinhado à esquerda
  popup.style.left  = (rect.left + window.scrollX) + "px";
  popup.style.top   = (rect.bottom + window.scrollY + 5) + "px";
  popup.classList.remove("hidden");
}
function hideMentionPopup(){
  document.getElementById("mention-popup").classList.add("hidden");
  mentionState.active = false;
}
function insertMention(userId){
  const u  = getUser(userId); if(!u) return;
  const ta = document.getElementById(mentionState.textareaId); if(!ta) return;
  const before = ta.value.slice(0, mentionState.startPos);
  const after  = ta.value.slice(ta.selectionStart);
  ta.value = before + `@${u.name} ` + after;
  ta.focus();
  const pos = before.length + u.name.length + 2;
  ta.setSelectionRange(pos, pos);
  hideMentionPopup();
}
function setupMentionTextarea(tid){
  const ta = document.getElementById(tid); if(!ta) return;
  ta.addEventListener("input", ()=>{
    const val=ta.value, pos=ta.selectionStart, chunk=val.slice(0,pos);
    const atIdx = chunk.lastIndexOf("@");
    if(atIdx===-1){ hideMentionPopup(); return; }
    const query = chunk.slice(atIdx+1);
    if(/\s/.test(query)){ hideMentionPopup(); return; } // espaço = fim da menção
    const m = getMatchingUsers(query);
    if(!m.length){ hideMentionPopup(); return; }
    mentionState = {active:true, query, startPos:atIdx, textareaId:tid, selectedIdx:0};
    showMentionPopup(ta, m);
  });
  ta.addEventListener("keydown", e=>{
    if(!mentionState.active) return;
    const m = getMatchingUsers(mentionState.query);
    if(e.key==="ArrowDown"){   e.preventDefault(); mentionState.selectedIdx=Math.min(mentionState.selectedIdx+1,m.length-1); showMentionPopup(ta,m); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); mentionState.selectedIdx=Math.max(mentionState.selectedIdx-1,0);         showMentionPopup(ta,m); }
    else if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); if(m[mentionState.selectedIdx]) insertMention(m[mentionState.selectedIdx].id); }
    else if(e.key==="Escape") hideMentionPopup();
  });
}
// Fecha o popup ao clicar fora dele
document.addEventListener("click", e=>{
  const mp = document.getElementById("mention-popup");
  if(mp && !mp.contains(e.target)) hideMentionPopup();
});
// Retorna array de IDs de usuários mencionados no texto
function extractMentions(text){
  return USERS.filter(u=>text.includes(`@${u.name}`)).map(u=>u.id);
}
// Converte @NomeUsuario em chip HTML colorido
function renderCommentText(text){
  let html = esc(text);
  USERS.forEach(u=>{
    html = html.replace(
      new RegExp(`@${u.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}`, "g"),
      `<span class="mention-chip">@${esc(u.name)}</span>`
    );
  });
  return html;
}

/* ══════════════════════════════════════════════════════════════════
   DETALHE DA TAREFA (modal)
   Abre um modal com todas as informações da tarefa:
   - Badges de prioridade, status e atraso
   - Descrição
   - Metadados (responsável, prazo, criador)
   - Tags
   - Botões de ação (iniciar, concluir, reabrir, editar, excluir)
     → visíveis conforme permissão (admin / criador / responsável)
   - Banner de edição simultânea (se outro usuário está editando)
   - Comentários com menções renderizadas
   - Formulário de novo comentário com @menção
   - Histórico de ações
══════════════════════════════════════════════════════════════════ */
function openTaskDetail(id){ renderTaskDetail(id, false); }

function renderTaskDetail(taskId, editing){
  const t  = getTask(taskId); if(!t) return;
  const as = getUser(t.assignee), cr = getUser(t.creator);
  const od = isLate(t.due, t.status);

  // Permissões: admin pode tudo; criador/responsável podem editar/concluir
  const canEdit = me.role==="admin" || t.creator===me.id || t.assignee===me.id;
  const canDel  = me.role==="admin" || t.creator===me.id;

  // Modo edição: abre formulário no mesmo modal
  if(editing){
    startEditingTask(taskId);
    openModal("Editar tarefa", renderTaskForm(t), ()=>stopEditingTask());
    bindFormEvents(taskId, true);
    return;
  }

  // Botões de ação conforme estado e permissão
  const btns = [];
  if(canEdit && t.status==="pending")   btns.push(`<button class="btn btn-B btn-sm" onclick="changeStatus('${taskId}','in_progress')">&#9654; Iniciar</button>`);
  if(canEdit && t.status!=="done")      btns.push(`<button class="btn btn-GN btn-sm" onclick="changeStatus('${taskId}','done')">Concluir</button>`);
  if(canEdit && t.status==="done")      btns.push(`<button class="btn btn-G btn-sm" onclick="changeStatus('${taskId}','pending')">&larrhk; Reabrir</button>`);
  if(canEdit)                           btns.push(`<button class="btn btn-G btn-sm" onclick="renderTaskDetail('${taskId}',true)">Editar</button>`);
  if(canDel)                            btns.push(`<button class="btn btn-D btn-sm" onclick="confirmDeleteTask('${taskId}')">Excluir</button>`);

  // Banner âmbar se outro usuário está editando agora
  const edId = editingTasks[taskId];
  const edU  = edId && edId!==me.id ? getUser(edId) : null;
  const editBanner = edU ? `<div style="display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--amb-bg);border-radius:var(--rs);margin-bottom:16px;border:1px solid var(--amb-bdr);font-size:12px;color:var(--amb)">
    <div class="editing-dot"></div>${avHTML(edU,20)}<span><strong>${esc(edU.name)}</strong> está editando esta tarefa agora…</span></div>` : "";

  // Comentários renderizados com @menções destacadas
  const comments = (t.comments||[]).map(c=>{
    const u = getUser(c.author);
    return `<div class="si" style="display:flex;gap:10px;margin-bottom:14px">
      ${avHTML(u,28,true)}
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:8px;align-items:baseline;margin-bottom:4px">
          <span style="font-size:13px;font-weight:600">${esc(u?.name||"?")}</span>
          <span style="font-size:11px;color:var(--tx3)">${fTs(c.ts)}</span>
        </div>
        <div class="cmt-bubble">${renderCommentText(c.text)}</div>
      </div>
    </div>`;
  }).join("");

  // Histórico em ordem reversa (mais recente primeiro)
  const history = (t.history||[]).slice().reverse().map(h=>{
    const u = getUser(h.u);
    return `<div style="display:flex;gap:9px;align-items:center;font-size:12px;color:var(--tx3);padding:6px 0;border-bottom:1px solid var(--bg2)">
      ${avHTML(u,18)}<span style="color:var(--tx2);font-weight:500">${esc(u?.name||"?")}</span>
      <span>${esc(h.a)}</span><span style="margin-left:auto;flex-shrink:0;font-size:11px">${fTs(h.ts)}</span>
    </div>`;
  }).join("");

  const html = `${editBanner}
    <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">
      <span class="bdg ${PBC[t.priority]}">${PL[t.priority]}</span>
      <span class="status-chip status-${t.status}">${SIC[t.status]} ${SL[t.status]}</span>
      ${od ? `<span class="bdg bdg-H">! Atrasada</span>` : ""}
    </div>
    ${t.desc ? `<p style="font-size:13px;color:var(--tx2);line-height:1.7;margin-bottom:16px;padding:12px 14px;background:var(--bg);border-radius:var(--rs);border:1px solid var(--bdr)">${esc(t.desc)}</p>` : ""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="meta-box">
        <p class="modal-section-title">Responsável</p>
        <div style="display:flex;align-items:center;gap:9px">${avHTML(as,28,true)}
          <div><p style="font-size:13px;font-weight:600">${esc(as?.name||"—")}</p><p style="font-size:11px;color:var(--tx3)">${esc(as?.title||"")}</p></div>
        </div>
      </div>
      <div class="meta-box">
        <p class="modal-section-title">Prazo</p>
        <p style="font-size:22px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;color:${od?"var(--red)":"var(--tx)"}">${fDate(t.due)||"—"}</p>
        <p style="font-size:11px;color:var(--tx3);margin-top:3px">Criada por ${esc(cr?.name||"?")}</p>
      </div>
    </div>
    ${t.tags?.length ? `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px">${t.tags.map(tg=>`<span class="tag">${esc(tg)}</span>`).join("")}</div>` : ""}
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px">${btns.join("")}</div>
    <hr class="sep"/>
    <p class="modal-section-title">Comentários (${(t.comments||[]).length})</p>
    ${comments}
    ${!comments ? `<p style="font-size:12px;color:var(--tx3);font-style:italic;margin-bottom:12px">Sem comentários ainda. Seja o primeiro!</p>` : ""}
    <div style="display:flex;gap:9px;margin-top:10px;align-items:flex-start">
      ${avHTML(me,28)}
      <div style="flex:1;position:relative">
        <textarea id="cmt-input" placeholder="Adicionar comentário… use @nome para mencionar" style="font-size:13px;min-height:64px;line-height:1.6" aria-label="Novo comentário"></textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px">
          <p style="font-size:11px;color:var(--tx3)">Ctrl+Enter para enviar</p>
          <button class="btn btn-P btn-sm" onclick="addComment('${taskId}')">Comentar</button>
        </div>
      </div>
    </div>
    <hr class="sep"/>
    <p class="modal-section-title">Histórico</p>
    ${history || `<p style="font-size:12px;color:var(--tx3);font-style:italic">Sem histórico.</p>`}`;

  openModal(t.title, html, ()=>stopEditingTask());

  // Configura @menção e Ctrl+Enter no textarea de comentário após render
  setTimeout(()=>{
    const inp = document.getElementById("cmt-input");
    if(inp){
      inp.addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.ctrlKey||e.metaKey)) addComment(taskId); });
      setupMentionTextarea("cmt-input");
    }
  }, 60);
}

/* ══════════════════════════════════════════════════════════════════
   FORMULÁRIO DE TAREFA (criar e editar)
   renderTaskForm → gera o HTML do formulário.
     init=null → modo criação (sem valores pré-preenchidos)
     init=task → modo edição (campos preenchidos com dados da tarefa)
     Em modo edição, exibe também o campo de Status.
   validateTitle   → validação inline do título (mínimo 3 chars)
   setPriority     → atualiza o seletor visual de prioridade
   bindFormEvents  → adiciona o handler de submit ao botão
   openNewTask     → abre o modal de criação
══════════════════════════════════════════════════════════════════ */
let _formPriority = "medium"; // estado da prioridade selecionada no form

function renderTaskForm(init){
  _formPriority = init?.priority || "medium";
  return `<div style="display:flex;flex-direction:column;gap:14px">
    <div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">TÍTULO *</label>
      <input id="f-title" value="${esc(init?.title||"")}" placeholder="Descreva a tarefa brevemente…" autocomplete="off" oninput="validateTitle()"/>
      <p id="f-title-err" style="font-size:11px;color:var(--red);margin-top:4px;min-height:14px"></p>
    </div>
    <div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">DESCRIÇÃO</label>
      <textarea id="f-desc" placeholder="Contexto, critérios de aceite, links úteis…">${esc(init?.desc||"")}</textarea>
    </div>
    <div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:8px;letter-spacing:.04em">PRIORIDADE</label>
      <!-- Seletor visual: 3 botões com estilo colorido ao selecionar -->
      <div class="pri-select-row">
        <div class="pri-opt${_formPriority==="high"?" sel-high":""}"   onclick="setPriority('high')"   data-pri="high">Alta</div>
        <div class="pri-opt${_formPriority==="medium"?" sel-medium":""}" onclick="setPriority('medium')" data-pri="medium">Média</div>
        <div class="pri-opt${_formPriority==="low"?" sel-low":""}"    onclick="setPriority('low')"    data-pri="low">Baixa</div>
      </div>
      <input type="hidden" id="f-priority" value="${_formPriority}"/>
    </div>
    ${init ? `<div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">STATUS</label>
      <select id="f-status">
        <option value="pending"     ${init.status==="pending"?     "selected":""}>Pendente</option>
        <option value="in_progress" ${init.status==="in_progress"? "selected":""}>Em Progresso</option>
        <option value="done"        ${init.status==="done"?        "selected":""}>Concluída</option>
      </select>
    </div>` : ""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">PRAZO</label>
        <!-- min= impede selecionar datas passadas -->
        <input type="date" id="f-due" value="${esc(init?.due||"")}" min="${new Date().toISOString().slice(0,10)}"/>
      </div>
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">RESPONSÁVEL</label>
        <select id="f-assignee">${USERS.map(u=>`<option value="${u.id}" ${(init?.assignee||me.id)===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select>
      </div>
    </div>
    <div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">TAGS <span style="font-weight:400;color:var(--tx3)">(separadas por vírgula)</span></label>
      <input id="f-tags" value="${esc((init?.tags||[]).join(", "))}" placeholder="design, backend, urgente…"/>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:6px;border-top:1px solid var(--bdr)">
      <button class="btn btn-G" onclick="closeModalForce()">Cancelar</button>
      <button class="btn btn-P" id="f-submit">${init ? "Salvar alterações" : "Criar tarefa"}</button>
    </div>
  </div>`;
}

function validateTitle(){
  const t = document.getElementById("f-title").value.trim();
  const e = document.getElementById("f-title-err");
  if(!e) return true;
  if(!t){ e.textContent="Título obrigatório"; return false; }
  if(t.length<3){ e.textContent="Mínimo 3 caracteres"; return false; }
  e.textContent=""; return true;
}

function setPriority(p){
  _formPriority = p;
  document.getElementById("f-priority").value = p;
  // Remove e re-aplica a classe de seleção em todos os botões
  document.querySelectorAll(".pri-opt").forEach(el=>{
    el.className = "pri-opt";
    if(el.dataset.pri===p) el.classList.add(`sel-${p}`);
  });
}

function bindFormEvents(editId, isEdit){
  // setTimeout evita race condition com o render do modal
  setTimeout(()=>{
    const btn = document.getElementById("f-submit"); if(!btn) return;
    btn.addEventListener("click", ()=>{
      if(!validateTitle()){ document.getElementById("f-title").focus(); return; }
      const data = {
        title:    document.getElementById("f-title").value.trim(),
        desc:     document.getElementById("f-desc").value.trim(),
        priority: document.getElementById("f-priority").value,
        due:      document.getElementById("f-due").value || null,
        assignee: document.getElementById("f-assignee").value,
        tags:     document.getElementById("f-tags").value.split(",").map(t=>t.trim()).filter(Boolean),
      };
      if(isEdit){
        const s = document.getElementById("f-status");
        if(s) data.status = s.value;
        updateTask(editId, data, "editada");
      } else {
        createTask(data);
      }
      closeModalForce();
    });
    // Ctrl+Enter também submete o formulário
    document.getElementById("modal-body").addEventListener("keydown", e=>{
      if(e.key==="Enter" && (e.ctrlKey||e.metaKey)) btn.click();
    });
  }, 30);
}

function openNewTask(){ openModal("Nova tarefa", renderTaskForm(null), null); bindFormEvents(null, false); }

/* ══════════════════════════════════════════════════════════════════
   CRUD DE TAREFAS
   createTask       → cria nova tarefa, adiciona ao topo da lista,
                      salva e dispara notificações
   updateTask       → aplica patch parcial a uma tarefa existente,
                      registra no histórico, salva e re-renderiza.
                      silent=true evita o toast (uso interno, ex: comentários)
   confirmDeleteTask → abre modal de confirmação antes de excluir
   deleteTask       → remove definitivamente do array e salva
   changeStatus     → atalho para updateTask mudando apenas o status
   addComment       → adiciona comentário, processa @menções, salva
══════════════════════════════════════════════════════════════════ */
function createTask(data){
  const t = {
    id:uid(), ...data,
    status:"pending", creator:me.id,
    comments:[], history:[{a:"criada", u:me.id, ts:Date.now()}]
  };
  TASKS.unshift(t);     // atualiza localmente de imediato (otimistic update)
  socket.emit("task_create", t); // envia ao servidor → replica para todos
  pushNotif(`Tarefa criada: "${t.title.slice(0,35)}"`, "+");
  toast(`Tarefa criada: "${t.title.slice(0,28)}"`, "+", "var(--grn)");
  renderContent();
}

function updateTask(id, patch, histMsg, silent=false){
  const idx = TASKS.findIndex(t=>t.id===id); if(idx<0) return;
  const t = TASKS[idx];
  const histEntry = histMsg ? {a:histMsg, u:me.id, ts:Date.now()} : null;
  if(histEntry){
    TASKS[idx] = {...t, ...patch, history:[...(t.history||[]), histEntry]};
  } else {
    TASKS[idx] = {...t, ...patch};
  }
  // Notifica se o responsável mudou
  if(patch.assignee && patch.assignee!==t.assignee){
    const nu = getUser(patch.assignee);
    if(nu && nu.id!==me.id) pushNotif(`${me.name} te atribuiu: "${t.title.slice(0,30)}"`, "→");
  }
  socket.emit("task_update", { id, patch, histEntry }); // sincroniza com todos
  if(!silent && histMsg) toast(histMsg, "·", "var(--blu)");
  renderContent();
  const modalOpen = !document.getElementById("modal-overlay").classList.contains("hidden");
  if(modalOpen){
    const mt = document.getElementById("modal-title").textContent;
    if(mt===t.title||mt===TASKS[idx].title) renderTaskDetail(id,false);
  }
}

function confirmDeleteTask(id){
  const t = getTask(id); if(!t) return;
  openModal("Confirmar exclusão", `<div class="confirm-box">
    <p style="font-size:13px;font-weight:600;color:var(--red);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px">Ação irreversível</p>
    <p>Tem certeza que deseja excluir<br><strong>"${esc(t.title)}"</strong>?</p>
    <div class="confirm-actions" style="margin-top:20px">
      <button class="btn btn-G" onclick="closeModalForce()">Cancelar</button>
      <button class="btn btn-D" onclick="deleteTask('${id}')">Excluir definitivamente</button>
    </div>
  </div>`, null);
}

function deleteTask(id){
  const t = getTask(id);
  TASKS = TASKS.filter(t=>t.id!==id);
  socket.emit("task_delete", id); // sincroniza com todos
  closeModalForce();
  toast(`"${(t?.title||"Tarefa").slice(0,28)}" excluída`, "×", "var(--red)");
  renderContent();
}

function changeStatus(id, status){ updateTask(id, {status}, `status → "${SL[status]}"`); }

function addComment(taskId){
  const inp = document.getElementById("cmt-input");
  const txt = inp?.value?.trim(); if(!txt){ inp?.focus(); return; }
  const t = getTask(taskId); if(!t) return;
  const c = {id:uid(), author:me.id, text:txt, ts:Date.now()};
  // Notifica usuários mencionados
  extractMentions(txt).forEach(uid2=>{
    const u = getUser(uid2);
    if(u && u.id!==me.id) pushNotif(`${me.name} te mencionou em "${t.title.slice(0,25)}"`, "@");
  });
  updateTask(taskId, {comments:[...(t.comments||[]),c]}, null, true);
  hideMentionPopup();
  renderTaskDetail(taskId, false); // re-renderiza o modal com o novo comentário
  toast("Comentário adicionado", "·", "var(--blu)");
}

/* ══════════════════════════════════════════════════════════════════
   MODAL DE ATALHOS DE TECLADO
   Lista todos os atalhos disponíveis com teclas formatadas em <kbd>.
   Aberto pelo botão na sidebar ou pressionando ? (fora de inputs).
══════════════════════════════════════════════════════════════════ */
function openShortcutsModal(){
  const shortcuts = [
    {k:["N"],              label:"Nova tarefa (fora de inputs)"},
    {k:["Ctrl","Enter"],   label:"Enviar comentário / formulário"},
    {k:["Ctrl","="],       label:"Aumentar zoom"},
    {k:["Ctrl","-"],       label:"Diminuir zoom"},
    {k:["Ctrl","0"],       label:"Zoom 100%"},
    {k:["Ctrl","Shift","D"],label:"Alternar tema claro/escuro"},
    {k:["Esc"],            label:"Fechar modal"},
    {k:["@"],              label:"Mencionar usuário em comentário"},
    {k:["↑ ↓"],           label:"Navegar menções / autocomplete"},
    {k:["Enter"],          label:"Confirmar seleção de menção"},
    {k:["?"],              label:"Mostrar atalhos"},
  ];
  openModal("Atalhos de teclado", `<div>${shortcuts.map(s=>`
    <div class="shortcut-row">
      <span style="color:var(--tx2)">${s.label}</span>
      <div style="display:flex;gap:4px;align-items:center">
        ${s.k.map(k=>`<kbd>${esc(k)}</kbd>`).join('<span style="font-size:11px;color:var(--tx3)">+</span>')}
      </div>
    </div>`).join("")}</div>`, null);
}


/* ══════════════════════════════════════════════════════════════════
   SINCRONIZAÇÃO DE USUÁRIOS VIA SOCKET
══════════════════════════════════════════════════════════════════ */
socket.on("user_created", (user) => {
  if (!USERS.find(u => u.id === user.id)) USERS.push(user);
  if (currentView === "team") renderContent();
  pushNotif("Novo funcionário: " + user.name, "+");
});

socket.on("user_updated", ({ id, patch }) => {
  const idx = USERS.findIndex(u => u.id === id);
  if (idx >= 0) USERS[idx] = { ...USERS[idx], ...patch };
  if (currentView === "team") renderContent();
  if (id === me?.id) {
    me = { ...me, ...patch };
    document.getElementById("sb-name").textContent  = me.name;
    document.getElementById("sb-title").textContent = me.title;
    document.getElementById("sb-avatar").innerHTML  = avHTML(me, 30, true);
  }
});

socket.on("user_deleted", (userId) => {
  const idx = USERS.findIndex(u => u.id === userId);
  if (idx >= 0) {
    const name = USERS[idx].name;
    USERS.splice(idx, 1);
    if (currentView === "team") renderContent();
    if (userId === me?.id) {
      toast("Sua conta foi removida pelo administrador.", "!", "var(--red)");
      setTimeout(() => logout(), 2500);
    } else {
      pushNotif("Funcionário removido: " + name, "×");
    }
  }
});

      "<div style=\"display:flex;gap:7px;border-top:1px solid var(--bdr);padding-top:12px\">" +
        "<button class=\"btn btn-G btn-sm\" onclick=\"openEditUserModal('" + u.id + "')\">Editar</button>" +
        "<button class=\"btn btn-G btn-sm\" onclick=\"openResetPasswordModal('" + u.id + "', '" + u.name.replace(/'/g,"&#39;") + "')\">Redefinir senha</button>" +
        (!isSelf ? "<button class=\"btn btn-D btn-sm\" onclick=\"confirmDeleteUser('" + u.id + "')\">Remover</button>" : "") +
      "</div>" +
    "</div>";
  }).join("");

  return "<div style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:24px\">" +
    "<div><h2 style=\"font-size:22px\">Gestão de equipe</h2>" +
    "<p style=\"font-size:12px;color:var(--tx3);margin-top:2px\">" + USERS.length + " funcionário" + (USERS.length!==1?"s":"") + " cadastrado" + (USERS.length!==1?"s":"") + "</p></div>" +
    "<button class=\"btn btn-P\" onclick=\"openNewUserModal()\">+ Adicionar funcionário</button>" +
    "</div>" +
    "<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px\">" + cards + "</div>";
}

/* Formulário de usuário */
function renderUserForm(init) {
  return `<div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">NOME COMPLETO *</label>
        <input id="uf-name" value="${esc(init?.name||"")}" placeholder="João Silva" oninput="autoFillInitials()"/>
        <p id="uf-name-err" style="font-size:11px;color:var(--red);margin-top:3px;min-height:14px"></p>
      </div>
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">EMAIL *</label>
        <input id="uf-email" type="email" value="${esc(init?.email||"")}" placeholder="joao@corp.com"/>
        <p id="uf-email-err" style="font-size:11px;color:var(--red);margin-top:3px;min-height:14px"></p>
      </div>
    </div>
    <div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">CARGO</label>
      <input id="uf-title" value="${esc(init?.title||"")}" placeholder="Dev Sênior, Designer UX…"/>
    </div>
    <div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:8px;letter-spacing:.04em">PERFIL DE ACESSO</label>
      <div style="display:flex;gap:8px">
        <label style="flex:1;border:1px solid var(--bdr);border-radius:var(--rs);padding:10px 12px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:8px" id="role-collab-label">
          <input type="radio" name="uf-role" id="uf-role-collab" value="collab" ${(!init||init.role==="collab")?"checked":""} onchange="updateRoleStyle()" style="width:auto;padding:0;margin:0;border:none;box-shadow:none"/>
          <div><p style="font-size:13px;font-weight:600">Colaborador</p><p style="font-size:11px;color:var(--tx3)">Gerencia suas próprias tarefas</p></div>
        </label>
        <label style="flex:1;border:1px solid var(--bdr);border-radius:var(--rs);padding:10px 12px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:8px" id="role-admin-label">
          <input type="radio" name="uf-role" id="uf-role-admin" value="admin" ${init?.role==="admin"?"checked":""} onchange="updateRoleStyle()" style="width:auto;padding:0;margin:0;border:none;box-shadow:none"/>
          <div><p style="font-size:13px;font-weight:600">Administrador</p><p style="font-size:11px;color:var(--tx3)">Acesso total, gerencia equipe</p></div>
        </label>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">INICIAIS DO AVATAR</label>
        <input id="uf-av" value="${esc(init?.av||"")}" placeholder="JS" maxlength="2" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase();updateAvatarPreview()"/>

          <div id="av-preview" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:${init?.clr||"#1A4E8A"}">${esc(init?.av||"?")}</div>
        </div>
      </div>
    </div>
    ${!init ? `<div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">SENHA INICIAL *</label>
      <input id="uf-password" type="password" placeholder="Mín. 6 caracteres"/>
      <p style="font-size:10px;color:var(--tx3);margin-top:3px">O usuário deverá trocar a senha no primeiro acesso.</p>

function updateRoleStyle() {
  const a = document.getElementById("uf-role-admin")?.checked;
  const la = document.getElementById("role-admin-label");
  const lc = document.getElementById("role-collab-label");
  if (!la) return;
  la.style.borderColor = a  ? "var(--acc)" : "var(--bdr)"; la.style.background = a  ? "var(--acc-bg)" : "";
  lc.style.borderColor = !a ? "var(--blu)" : "var(--bdr)"; lc.style.background = !a ? "var(--blu-bg)" : "";
}

function autoFillInitials() {
  const avEl = document.getElementById("uf-av");
  if (!avEl || avEl.dataset.manual) return;
  const parts = (document.getElementById("uf-name")?.value||"").trim().split(/\s+/);
  avEl.value = parts.length===1 ? parts[0].slice(0,2).toUpperCase() : (parts[0][0]+(parts[parts.length-1][0]||"")).toUpperCase();
  updateAvatarPreview();
}

function updateAvatarPreview() {
  const av  = document.getElementById("uf-av")?.value  || "?";
  const clr = document.getElementById("uf-clr")?.value || "#1A4E8A";
  const p = document.getElementById("av-preview");
  if (p) { p.textContent = av; p.style.background = clr; }
}

function bindUserForm(userId) {
  const isEdit = !!userId;
  setTimeout(() => {
    updateRoleStyle();
    document.getElementById("uf-av")?.addEventListener("input", () => { document.getElementById("uf-av").dataset.manual="1"; });
    document.getElementById("uf-submit")?.addEventListener("click", () => {
      const name  = document.getElementById("uf-name").value.trim();
      const email = document.getElementById("uf-email").value.trim();
      document.getElementById("uf-name-err").textContent   = "";
      document.getElementById("uf-email-err").textContent  = "";
      document.getElementById("uf-server-err").textContent = "";
      if (!name)  { document.getElementById("uf-name-err").textContent  = "Nome obrigatório";  return; }
      if (!email) { document.getElementById("uf-email-err").textContent = "Email obrigatório"; return; }
      // Valida senha apenas na criação
      if (!isEdit) {
        const pwd = document.getElementById("uf-password")?.value || "";
        const pwdErr = document.getElementById("uf-password-err");
        if (!pwd) { pwdErr.textContent = "Senha obrigatória"; return; }
        if (pwd.length < 6) { pwdErr.textContent = "Mín. 6 caracteres"; return; }
      }
      const role = document.querySelector('input[name="uf-role"]:checked')?.value || "collab";
      const payload = { name, email, role,
        title: document.getElementById("uf-title").value.trim(),
        av:    document.getElementById("uf-av").value.toUpperCase().slice(0,2) || name.slice(0,2).toUpperCase(),
        clr:   document.getElementById("uf-clr").value,
      };
      if (!isEdit) payload.password = document.getElementById("uf-password").value;
      const btn = document.getElementById("uf-submit");
      btn.disabled=true; btn.textContent="Salvando…";
      const evt = isEdit ? "user_update" : "user_create";
      const data = isEdit ? { id: userId, patch: payload } : payload;
      socket.emit(evt, data, (res) => {
        if (res.error) {
          document.getElementById("uf-server-err").textContent = res.error;
          btn.disabled=false; btn.textContent = isEdit ? "Salvar alterações" : "Adicionar funcionário"; return;
        }
        if (isEdit) { const idx=USERS.findIndex(u=>u.id===userId); if(idx>=0) USERS[idx]=res.user; }
        else { if (!USERS.find(u=>u.id===res.user.id)) USERS.push(res.user); }
        closeModalForce();
        toast(isEdit ? res.user.name+" atualizado(a)" : res.user.name+" adicionado(a) à equipe", isEdit?"·":"+", isEdit?"var(--blu)":"var(--grn)");
        renderContent();
      });
    });
  }, 50);
}

function openNewUserModal()       { openModal("Adicionar funcionário", renderUserForm(null), null); bindUserForm(null); }
function openEditUserModal(uid)   { const u=USERS.find(u=>u.id===uid); if(!u) return; openModal("Editar — "+u.name, renderUserForm(u), null); bindUserForm(uid); }

function confirmDeleteUser(userId) {
  const u = USERS.find(u=>u.id===userId); if (!u) return;
  const tc = TASKS.filter(t=>t.assignee===userId).length;
  openModal("Confirmar remoção", `<div class="confirm-box">
    <p style="font-size:13px;font-weight:600;color:var(--red);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px">Remover funcionário</p>
    <p>Tem certeza que deseja remover <strong>${esc(u.name)}</strong> da equipe?</p>
    ${tc>0?`<p style="margin-top:8px;font-size:12px;color:var(--amb)">Atenção: este funcionário possui <strong>${tc}</strong> tarefa${tc!==1?"s":""} atribuída${tc!==1?"s":""}. As tarefas não serão excluídas.</p>`:""}
    <div class="confirm-actions" style="margin-top:20px">
      <button class="btn btn-G" onclick="closeModalForce()">Cancelar</button>
      <button class="btn btn-D" onclick="executeDeleteUser('${userId}')">Remover definitivamente</button>
    </div>
  </div>`, null);
}

function executeDeleteUser(userId) {
  socket.emit("user_delete", userId, (res) => {
    if (res.error) { toast(res.error, "!", "var(--red)"); return; }
    const idx=USERS.findIndex(u=>u.id===userId), name=idx>=0?USERS[idx].name:"Funcionário";
    if(idx>=0) USERS.splice(idx,1);
    closeModalForce(); toast(name+" removido(a)","×","var(--red)"); renderContent();
  });
}

/* ── Modal: trocar própria senha ── */
function openChangePasswordModal(forced = false) {
  const title = forced ? "Troque sua senha para continuar" : "Trocar senha";
  openModal(title, `<div style="display:flex;flex-direction:column;gap:14px">
    ${forced ? `<p style="font-size:12px;color:var(--amb);background:var(--amb-bg);border:1px solid var(--amb-bdr);padding:10px 12px;border-radius:var(--rs)">
      Esta é a senha padrão do sistema. Por segurança, defina uma senha pessoal antes de continuar.
    </p>` : ""}
    <div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">SENHA ATUAL</label>
      <input id="cp-current" type="password" placeholder="••••••••"/>
    </div>
    <div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">NOVA SENHA</label>
      <input id="cp-new" type="password" placeholder="Mín. 6 caracteres"/>
    </div>
    <div>
      <label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:5px;letter-spacing:.04em">CONFIRMAR NOVA SENHA</label>
      <input id="cp-confirm" type="password" placeholder="Repita a nova senha"/>
    </div>
    <p id="cp-err" style="font-size:12px;color:var(--red);min-height:14px"></p>
    <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:6px;border-top:1px solid var(--bdr)">
      ${!forced ? `<button class="btn btn-G" onclick="closeModalForce()">Cancelar</button>` : ""}
      <button class="btn btn-P" id="cp-submit">Salvar nova senha</button>
    </div>
  </div>`, null);
  setTimeout(() => {
    document.getElementById("cp-submit")?.addEventListener("click", () => {
      const cur  = document.getElementById("cp-current").value;
      const nw   = document.getElementById("cp-new").value;
      const conf = document.getElementById("cp-confirm").value;
      const errEl = document.getElementById("cp-err");
      errEl.textContent = "";
      if (!cur)  { errEl.textContent = "Informe a senha atual."; return; }
      if (!nw)   { errEl.textContent = "Informe a nova senha."; return; }
      if (nw.length < 6) { errEl.textContent = "A nova senha deve ter ao menos 6 caracteres."; return; }
      if (nw !== conf)   { errEl.textContent = "As senhas não coincidem."; return; }
      const btn = document.getElementById("cp-submit");
      btn.disabled = true; btn.textContent = "Salvando…";
      socket.emit("change_password", { currentPassword: cur, newPassword: nw }, (res) => {
        if (res.error) { errEl.textContent = res.error; btn.disabled=false; btn.textContent="Salvar nova senha"; return; }
        // Atualiza flag local
        if (me) me.mustChangePassword = false;
        closeModalForce();
        toast("Senha alterada com sucesso", "✓", "var(--grn)");
      });
    });
  }, 50);
}

/* ══════════════════════════════════════════════════════════════════
   TEMA (claro / escuro)
   applyTheme → adiciona/remove a classe .dark no <html>, atualiza
     o botão de toggle e persiste a preferência no localStorage.
   loadTheme  → carrega a preferência salva ou usa a do sistema
     (prefers-color-scheme). Também registra listener para mudança
     automática se o usuário não tiver preferência salva.
══════════════════════════════════════════════════════════════════ */
let isDark = false;
function applyTheme(dark){
  isDark = dark;
  document.documentElement.classList.toggle("dark", dark);
  const btn = document.getElementById("theme-toggle");
  // ◑ = meio círculo (tema claro) | ● = círculo cheio (tema escuro)
  if(btn) btn.innerHTML = dark ? "🌑" : "☀️";
  try{ localStorage.setItem("tf8_theme", dark?"dark":"light"); }catch(e){}
}
function toggleTheme(){ applyTheme(!isDark); }
function loadTheme(){
  const saved = localStorage.getItem("tf8_theme");
  const prefersDark = window.matchMedia?.("(prefers-color-scheme:dark)").matches;
  applyTheme(saved ? saved==="dark" : prefersDark);
  // Escuta mudanças na preferência do sistema operacional
  window.matchMedia?.("(prefers-color-scheme:dark)").addEventListener("change", e=>{
    if(!localStorage.getItem("tf8_theme")) applyTheme(e.matches);
  });
}

/* ══════════════════════════════════════════════════════════════════
   ATALHOS DE TECLADO GLOBAIS
   Escuta keydown em todo o documento.
   Atalhos que dependem de Ctrl são seguros em inputs.
   Atalhos de letra única (N, ?) só disparam fora de inputs e modais.
══════════════════════════════════════════════════════════════════ */
document.addEventListener("keydown", e=>{
  if(!me) return; // ignora se não há usuário logado
  if(e.ctrlKey && (e.key==="="||e.key==="+")){ e.preventDefault(); changeZoom(+1); }
  if(e.ctrlKey && e.key==="-"){                e.preventDefault(); changeZoom(-1); }
  if(e.ctrlKey && e.key==="0"){                e.preventDefault(); zoomIdx=4; applyZoom(); } // reset para 100%
  if(e.ctrlKey && e.shiftKey && e.key==="D"){  e.preventDefault(); toggleTheme(); }
  const modalOpen = !document.getElementById("modal-overlay").classList.contains("hidden");
  const inInput   = document.activeElement.tagName==="INPUT" || document.activeElement.tagName==="TEXTAREA";
  if(!modalOpen && !inInput){
    if(e.key==="?") openShortcutsModal();
    if(e.key==="n" && !e.ctrlKey && !e.metaKey && !e.shiftKey) openNewTask();
  }
});

/* ══════════════════════════════════════════════════════════════════
   INICIALIZAÇÃO (boot)
   1. loadTheme → aplica tema claro/escuro salvo
   2. loadZoom  → aplica zoom salvo
   3. Busca usuários reais do servidor via /api/users
   4. initLogin → renderiza lista de usuários atualizada
   As tarefas chegam via socket.on("init") após o login.
══════════════════════════════════════════════════════════════════ */
loadTheme();
loadZoom();

// Busca a lista atualizada de usuários do servidor antes de mostrar o login
fetch("/api/users")
  .then(r => r.json())
  .then(serverUsers => {
    if (serverUsers && serverUsers.length) {
      USERS.length = 0;
      serverUsers.forEach(u => USERS.push(u));
    }
  })
  .catch(() => { /* fallback: usa USERS hardcoded */ })
  .finally(() => initLogin());
</script>
